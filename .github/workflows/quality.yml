name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned browser engines
        run: npm run browsers:install -- --with-deps
      - name: Run full release verification
        run: npm run verify
      - name: Preserve the exact verified site
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: site
          if-no-files-found: error
          retention-days: 1
      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            evidence/reports
            test-results
          if-no-files-found: ignore
          retention-days: 7
