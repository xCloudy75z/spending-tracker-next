<!doctype html>
<html lang="en" dir="ltr" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A private, offline-first daily spending tracker.">
    <meta name="theme-color" content="#F3F0E8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Spending Tracker">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <link rel="canonical" href="https://xcloudy75z.github.io/spending-tracker-next/app/">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./assets/app.css">
    <title>Spending Tracker</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="app" class="app-shell">
      <header class="app-header">
        <a class="wordmark" href="#/today" aria-label="Spending Tracker home">
          <img src="./assets/brand/mark.svg" alt="" width="32" height="32">
          <span>Spending Tracker</span>
        </a>
        <button class="icon-button header-action" type="button" data-save-state aria-label="Open data tools">
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-more"></use></svg>
        </button>
      </header>

      <main id="main-content" tabindex="-1">
        <div id="view" aria-live="polite"></div>
      </main>

      <nav class="bottom-nav" aria-label="Primary">
        <a href="#/today" data-route="today">
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-today"></use></svg>
          <span data-nav-label>Today</span>
        </a>
        <a href="#/activity" data-route="activity">
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-activity"></use></svg>
          <span data-nav-label>Activity</span>
        </a>
        <a href="#/plan" data-route="plan">
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-plan"></use></svg>
          <span data-nav-label>Plan</span>
        </a>
        <a href="#/card" data-route="card">
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#icon-card"></use></svg>
          <span data-nav-label>Card</span>
        </a>
      </nav>

      <div id="dialog-host"></div>
      <div class="visually-hidden" data-live-region aria-live="polite" aria-atomic="true"></div>
    </div>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-mark" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="currentColor"></circle>
        <path d="M7 19h18M10 15h12M13 11h6" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"></path>
      </symbol>
      <symbol id="icon-today" viewBox="0 0 24 24">
        <path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0Zm4 2 3-3 2 2 3-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </symbol>
      <symbol id="icon-activity" viewBox="0 0 24 24">
        <path d="M6 6h12M6 12h12M6 18h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
      </symbol>
      <symbol id="icon-plan" viewBox="0 0 24 24">
        <path d="M5 5h14v14H5zM9 9h6M9 13h6M9 17h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
      </symbol>
      <symbol id="icon-card" viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
        <path d="M3 10h18" stroke="currentColor" stroke-width="1.8"></path>
      </symbol>
      <symbol id="icon-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.5" fill="currentColor"></circle>
        <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
        <circle cx="19" cy="12" r="1.5" fill="currentColor"></circle>
      </symbol>
    </svg>
    <noscript>This app requires JavaScript to manage local spending data.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
